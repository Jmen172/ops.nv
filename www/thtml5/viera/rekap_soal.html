<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekapitulasi Soal VIERA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f4f6fc;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #475569;
      --border-color: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-hover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --badge-listening-bg: #dbeafe;
      --badge-listening-text: #1e40af;
      --badge-reading-bg: #dcfce7;
      --badge-reading-text: #166534;
      --badge-dir-bg: #fef3c7;
      --badge-dir-text: #92400e;
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --border-color: #334155;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
      --badge-listening-bg: #1e3a8a;
      --badge-listening-text: #93c5fd;
      --badge-reading-bg: #064e3b;
      --badge-reading-text: #86efac;
      --badge-dir-bg: #78350f;
      --badge-dir-text: #fde047;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 320px;
      border-right: 1px solid var(--border-color);
      background-color: var(--bg-card);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 5px;
    }

    .sidebar-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .question-grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      margin-top: 15px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .grid-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }

    .grid-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .grid-btn.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .grid-btn.visited {
      border-color: var(--primary);
      background-color: rgba(37, 99, 235, 0.05);
    }

    /* Main Content */
    .main-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* Top Navigation bar */
    .top-bar {
      height: 70px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 10;
    }

    .search-box {
      position: relative;
      width: 300px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-size: 0.875rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: var(--bg-primary);
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
    }

    .container-width {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Card Styling */
    .q-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-margin-top: 20px;
    }

    .q-card:hover {
      box-shadow: var(--shadow-hover);
    }

    .q-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 12px;
    }

    .q-id {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
    }

    .badge {
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-listening {
      background-color: var(--badge-listening-bg);
      color: var(--badge-listening-text);
    }

    .badge-reading {
      background-color: var(--badge-reading-bg);
      color: var(--badge-reading-text);
    }

    .badge-dir {
      background-color: var(--badge-dir-bg);
      color: var(--badge-dir-text);
    }

    /* Split layout inside card body */
    .q-card-body {
      display: flex;
      gap: 24px;
      margin-top: 4px;
    }

    .q-card-left {
      flex: 1.3;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .q-card-right {
      flex: 0.7;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      min-width: 0;
    }

    .q-text {
      font-size: 1.05rem;
      line-height: 1.6;
      font-weight: 500;
    }

    /* Audio / Image Containers */
    .media-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 8px 0;
    }

    .audio-player {
      width: 100%;
      border-radius: 8px;
    }

    .question-image-wrapper {
      max-width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background-color: #f8fafc;
      align-self: flex-start;
      cursor: pointer;
    }

    .question-image-wrapper img {
      display: block;
      max-width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: contain;
    }

    /* Options List */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-primary);
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .option-item:hover {
      border-color: var(--primary);
      background-color: rgba(37, 99, 235, 0.03);
    }

    .option-item.selected {
      border-color: var(--primary);
      background-color: rgba(37, 99, 235, 0.08);
      font-weight: 600;
    }

    .option-item.correct-answer-option {
      border-color: #22c55e;
      background-color: rgba(34, 197, 94, 0.05);
      font-weight: 600;
    }

    .option-item.correct-answer-option::after {
      content: "✓ Kunci";
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      font-weight: 700;
      color: #22c55e;
      background-color: rgba(34, 197, 94, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
    }

    [data-theme="dark"] .option-item.correct-answer-option {
      background-color: rgba(34, 197, 94, 0.08);
      border-color: #4ade80;
    }

    [data-theme="dark"] .option-item.correct-answer-option::after {
      color: #4ade80;
      background-color: rgba(74, 222, 128, 0.15);
    }

    .option-radio {
      margin-right: 12px;
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    /* Right column components */
    .right-section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 6px;
    }

    .correct-answer-box {
      background-color: rgba(22, 101, 52, 0.08);
      border: 1px dashed #166534;
      border-radius: 8px;
      padding: 14px;
      color: #166534;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    [data-theme="dark"] .correct-answer-box {
      background-color: rgba(34, 197, 94, 0.1);
      border-color: #22c55e;
      color: #4ade80;
    }

    .correct-badge {
      background-color: #166534;
      color: white;
      font-weight: 700;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.85rem;
    }

    [data-theme="dark"] .correct-badge {
      background-color: #22c55e;
      color: #0f172a;
    }

    .transcript-text {
      font-size: 0.925rem;
      line-height: 1.55;
      color: var(--text-main);
      white-space: pre-line;
      font-style: italic;
      background-color: var(--bg-card);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    /* Theme Switch Button */
    .theme-toggle svg {
      width: 20px;
      height: 20px;
    }

    /* Image Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.85);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: zoom-out;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Responsive details */
    @media (max-width: 992px) {
      .q-card-body {
        flex-direction: column;
      }
      .q-card-left, .q-card-right {
        flex: none;
        width: 100%;
      }
    }

    /* Print Styles */
    @media print {
      body {
        background-color: white !important;
        color: black !important;
        height: auto;
        overflow: visible;
      }
      .sidebar, .top-bar, .theme-toggle, .lightbox {
        display: none !important;
      }
      .main-layout {
        height: auto;
        overflow: visible;
      }
      .content-scroll {
        overflow: visible;
        padding: 0;
      }
      .container-width {
        max-width: 100%;
        gap: 30px;
      }
      .q-card {
        border: 1px solid #000 !important;
        box-shadow: none !important;
        page-break-inside: avoid;
        padding: 15px;
      }
      .q-card-body {
        flex-direction: column;
        gap: 12px;
      }
      .q-card-left, .q-card-right {
        width: 100% !important;
        background-color: white !important;
        border-color: #000 !important;
        padding: 0 !important;
      }
      .option-item {
        background-color: white !important;
        border-color: #ccc !important;
      }
      .correct-answer-box {
        background-color: white !important;
        border-color: #000 !important;
        color: black !important;
      }
      .correct-badge {
        background-color: black !important;
        color: white !important;
      }
      .transcript-text {
        background-color: white !important;
        border-color: #ccc !important;
      }
    }
  </style>
</head>

  </div>

          }

          // Question Text
          if (q.question && q.question !== `${q.id.replace(/[^\d]/g, '')}.`) {
            const text = document.createElement("div");
            text.className = "q-text";
            text.textContent = q.question;
            cardLeft.appendChild(text);
          }

          // Options List
          if (q.options && q.options.length > 0) {
            const optionsList = document.createElement("div");
            optionsList.className = "options-list";

            const correctKey = correctAnswers[q.id] || null;

            q.options.forEach((opt, idx) => {
              const item = document.createElement("div");
              item.className = "option-item";

              // Highlight correct answer
              if (correctKey && isCorrectOption(opt, correctKey)) {
                item.classList.add("correct-answer-option");
              }

              if (selectedAnswers[q.id] === opt) {
                item.classList.add("selected");
              }

              const radio = document.createElement("input");
              radio.type = "radio";
              radio.name = `radio-${q.id}`;
              radio.className = "option-radio";
              radio.checked = selectedAnswers[q.id] === opt;

              const label = document.createElement("span");
              label.textContent = opt;

              item.appendChild(radio);
              item.appendChild(label);

              item.addEventListener("click", () => {
                // Update selected answer
                selectedAnswers[q.id] = opt;
                // Update active sidebar state
                const gridBtn = document.querySelector(`.grid-btn[href="#${q.id}"]`);
                if (gridBtn) gridBtn.classList.add("visited");
                // Re-render only options of this card
                item.parentElement.querySelectorAll(".option-item").forEach(el => {
                  el.classList.remove("selected");
                  el.querySelector("input").checked = false;
                });
                item.classList.add("selected");
                radio.checked = true;
              });

              optionsList.appendChild(item);
            });

            cardLeft.appendChild(optionsList);
          }

          cardBody.appendChild(cardLeft);

          // Card Right: answer panel for all questions, transcript only for listening
          if (hasAnswer) {
            const cardRight = document.createElement("div");
            cardRight.className = "q-card-right";

            // Correct Answer Title
            const answerTitle = document.createElement("div");
            answerTitle.className = "right-section-title";
            answerTitle.textContent = "Kunci Jawaban";
            cardRight.appendChild(answerTitle);

            // Correct Answer Value
            const correctKey = correctAnswers[q.id];
            let correctText = "";
            if (q.options) {
              const found = q.options.find(opt => isCorrectOption(opt, correctKey));
              correctText = found ? found : `${correctKey})`;
            } else {
              correctText = `${correctKey})`;
            }

            const ansBox = document.createElement("div");
            ansBox.className = "correct-answer-box";
            ansBox.innerHTML = `<span class="correct-badge">${correctKey}</span> <span>${correctText}</span>`;
            cardRight.appendChild(ansBox);

            // Transcript section - only for listening questions
            if (isListening) {
              const transTitle = document.createElement("div");
              transTitle.className = "right-section-title";
              transTitle.textContent = "Transkrip Audio";
              cardRight.appendChild(transTitle);

              const transText = document.createElement("div");
              transText.className = "transcript-text";
              transText.textContent = transcriptionsData[q.id] || "Transkrip audio tidak tersedia.";
              cardRight.appendChild(transText);
            }

            cardBody.appendChild(cardRight);
          }

          card.appendChild(cardBody);
          questionsContainer.appendChild(card);
        });
      }

      // Search & Filter Events
      searchInput.addEventListener("input", (e) => {
        searchFilter = e.target.value;
        renderQuestions();
      });

      filterType.addEventListener("change", (e) => {
        typeFilter = e.target.value;
        renderQuestions();
      });

      // Lightbox / Image Zoom
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightbox-img");

      function showLightbox(src) {
        lightboxImg.src = src;
        lightbox.classList.add("active");
      }

      lightbox.addEventListener("click", () => {
        lightbox.classList.remove("active");
      });

      // Dark Mode Toggle
      themeBtn.addEventListener("click", () => {
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        if (isDark) {
          document.documentElement.removeAttribute("data-theme");
          document.getElementById("theme-icon-light").style.display = "none";
          document.getElementById("theme-icon-dark").style.display = "block";
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
          document.getElementById("theme-icon-light").style.display = "block";
          document.getElementById("theme-icon-dark").style.display = "none";
        }
      });

      // Initial Render
      renderQuestions();
    });
  </script>
</body>
</html>
